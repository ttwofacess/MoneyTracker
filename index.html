<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Bancario</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: #242830;
    --accent: #00d4aa;
    --accent2: #0095ff;
    --danger: #ff4d6a;
    --warn: #f5a623;
    --text: #e8eaf0;
    --muted: #5a6070;
    --muted2: #8892a4;
    --in-color: #00d4aa;
    --out-color: #ff4d6a;
    --own-in: #0095ff;
    --own-out: #f5a623;
    --radius: 10px;
    --font-mono: 'DM Mono', monospace;
    --font-sans: 'Sora', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-weight: 700; font-size: 16px; letter-spacing: -.3px; display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
  nav { display: flex; gap: 4px; }
  .nav-btn {
    background: none; border: none; color: var(--muted2); padding: 6px 14px;
    border-radius: 6px; cursor: pointer; font-family: var(--font-sans); font-size: 13px;
    transition: all .15s;
  }
  .nav-btn:hover { color: var(--text); background: var(--surface2); }
  .nav-btn.active { color: var(--accent); background: rgba(0,212,170,.1); }
  .main { flex: 1; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

  /* ── MONTH NAV ── */
  .month-nav {
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
  }
  .month-label {
    font-size: 22px; font-weight: 700; min-width: 180px; text-align: center;
    letter-spacing: -.5px;
  }
  .month-label span { color: var(--accent); }
  .arrow-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: var(--radius); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    transition: all .15s;
  }
  .arrow-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }

  /* ── BANK TABS ── */
  .bank-tabs {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .bank-tab {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted2); padding: 7px 16px; border-radius: 20px;
    cursor: pointer; font-size: 13px; font-family: var(--font-sans);
    transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .bank-tab:hover { color: var(--text); border-color: var(--muted); }
  .bank-tab.active { color: var(--accent); border-color: var(--accent); background: rgba(0,212,170,.08); font-weight: 600; }
  .bank-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .all-tab { background: var(--surface); border: 1px solid var(--border); color: var(--muted2); padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-family: var(--font-sans); transition: all .15s; }
  .all-tab:hover { color: var(--text); }
  .all-tab.active { color: var(--accent2); border-color: var(--accent2); background: rgba(0,149,255,.08); font-weight: 600; }

  /* ── SUMMARY CARDS ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
  .card-value { font-family: var(--font-mono); font-size: 18px; font-weight: 500; }
  .card-value.in { color: var(--in-color); }
  .card-value.out { color: var(--out-color); }
  .card-value.own-in { color: var(--own-in); }
  .card-value.own-out { color: var(--own-out); }
  .card-value.net.pos { color: var(--in-color); }
  .card-value.net.neg { color: var(--out-color); }

  /* ── TABLE ── */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 24px;
  }
  .table-toolbar {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .table-title { font-weight: 600; font-size: 14px; }
  .btn {
    padding: 7px 14px; border-radius: 7px; border: none; cursor: pointer;
    font-family: var(--font-sans); font-size: 13px; font-weight: 600;
    transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #00f2c3; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--muted); }
  .btn-danger { background: rgba(255,77,106,.1); color: var(--danger); border: 1px solid rgba(255,77,106,.2); }
  .btn-danger:hover { background: rgba(255,77,106,.2); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 10px 14px; text-align: left; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px; background: var(--surface2);
    border-bottom: 1px solid var(--border); font-weight: 500; white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,.025); }
  tbody td { padding: 10px 14px; font-family: var(--font-mono); font-size: 13px; }
  td.date-cell { color: var(--muted2); font-size: 12px; }
  td.in-cell { color: var(--in-color); }
  td.out-cell { color: var(--out-color); }
  td.own-in-cell { color: var(--own-in); }
  td.own-out-cell { color: var(--own-out); }
  td.bank-cell { font-family: var(--font-sans); font-size: 13px; color: var(--muted2); }
  td.actions { display: flex; gap: 6px; }
  .icon-btn {
    background: none; border: none; cursor: pointer; padding: 4px 6px;
    border-radius: 5px; font-size: 13px; transition: background .15s;
    color: var(--muted); font-family: var(--font-mono);
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn.del:hover { color: var(--danger); }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center; padding: 48px 24px; color: var(--muted);
  }
  .empty .empty-icon { font-size: 32px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* ── MODAL ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 16px; backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; width: 100%; max-width: 480px;
    transform: translateY(20px); transition: transform .2s;
  }
  .overlay.open .modal { transform: translateY(0); }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; color: var(--muted2); text-transform: uppercase; letter-spacing: .6px; }
  input, select {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 7px; font-size: 14px; font-family: var(--font-sans);
    transition: border-color .15s; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── CHARTS ── */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .chart-card-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; color: var(--muted2); text-transform: uppercase; letter-spacing: .5px; }
  canvas { max-width: 100%; }

  /* ── SETTINGS ── */
  .settings-section { margin-bottom: 28px; }
  .settings-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .settings-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .banks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .bank-setting {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .bank-setting-header { display: flex; justify-content: space-between; align-items: center; }
  .bank-num { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .bank-color-dot { width: 10px; height: 10px; border-radius: 50%; }
  .saldo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .danger-zone {
    background: rgba(255,77,106,.05); border: 1px solid rgba(255,77,106,.15);
    border-radius: var(--radius); padding: 16px;
  }
  .danger-title { color: var(--danger); font-size: 13px; font-weight: 600; margin-bottom: 10px; }

  /* ── VIEW TRANSITIONS ── */
  .view { display: none; }
  .view.active { display: block; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .summary-grid { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .charts-grid { grid-template-columns: 1fr; }
    header { padding: 0 14px; }
    .main { padding: 14px; }
  }

  /* ── BADGE ── */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    font-family: var(--font-mono);
  }
  .badge.in { background: rgba(0,212,170,.12); color: var(--in-color); }
  .badge.out { background: rgba(255,77,106,.12); color: var(--out-color); }

  /* totals row */
  tfoot td {
    padding: 10px 14px; font-family: var(--font-mono); font-size: 13px;
    font-weight: 500; background: var(--surface2); border-top: 2px solid var(--border);
  }
  tfoot .lbl { font-family: var(--font-sans); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .pill-year {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 6px; font-size: 13px;
    font-family: var(--font-mono); color: var(--muted2);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      Tracker Bancario
    </div>
    <nav>
      <button class="nav-btn active" onclick="showView('movements')">Movimientos</button>
      <button class="nav-btn" onclick="showView('charts')">Gráficos</button>
      <button class="nav-btn" onclick="showView('settings')">Configuración</button>
    </nav>
  </header>

  <div class="main">

    <!-- ═══ VIEW: MOVEMENTS ═══ -->
    <div class="view active" id="view-movements">
      <div class="month-nav">
        <button class="arrow-btn" onclick="changeMonth(-1)">&#8592;</button>
        <div class="month-label" id="month-label">—</div>
        <button class="arrow-btn" onclick="changeMonth(1)">&#8594;</button>
        <div class="pill-year" id="year-label">—</div>
      </div>

      <!-- bank tabs -->
      <div class="bank-tabs" id="bank-tabs"></div>

      <!-- summary cards -->
      <div class="summary-grid" id="summary-cards"></div>

      <!-- table -->
      <div class="table-wrap">
        <div class="table-toolbar">
          <span class="table-title" id="table-title">Movimientos</span>
          <button class="btn btn-primary" onclick="openModal()">+ Agregar</button>
        </div>
        <div id="table-container"></div>
      </div>
    </div>

    <!-- ═══ VIEW: CHARTS ═══ -->
    <div class="view" id="view-charts">
      <div class="month-nav">
        <button class="arrow-btn" onclick="changeMonth(-1)">&#8592;</button>
        <div class="month-label" id="month-label-chart">—</div>
        <button class="arrow-btn" onclick="changeMonth(1)">&#8594;</button>
      </div>
      <div class="charts-grid" id="charts-container"></div>
    </div>

    <!-- ═══ VIEW: SETTINGS ═══ -->
    <div class="view" id="view-settings">
      <div class="settings-section">
        <div class="settings-title">Bancos</div>
        <div class="banks-grid" id="banks-grid"></div>
      </div>
      <div class="settings-section">
        <div class="settings-title">Datos</div>
        <div class="danger-zone">
          <div class="danger-title">Zona de peligro</div>
          <button class="btn btn-danger" onclick="clearAll()">🗑 Borrar todos los datos</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Agregar movimiento</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Banco</label>
        <select id="f-bank"></select>
      </div>
      <div class="form-group full">
        <label>Fecha</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group">
        <label>Own In</label>
        <input type="number" id="f-own-in" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Own Out</label>
        <input type="number" id="f-own-out" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>In</label>
        <input type="number" id="f-in" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Out</label>
        <input type="number" id="f-out" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group full">
        <label>Descripción (opcional)</label>
        <input type="text" id="f-desc" placeholder="Ej: Pago proveedor...">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveMovement()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  STATE & STORAGE
// ═══════════════════════════════════════════════════════
const STORAGE_KEY = 'banco-tracker-v1';
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const BANK_COLORS = ['#00d4aa','#0095ff','#f5a623','#ff4d6a','#a855f7','#22d3ee'];

function defaultState() {
  return {
    banks: [
      { id: 1, name: 'Banco 1', saldoInicial: 0, fci: 0 },
      { id: 2, name: 'Banco 2', saldoInicial: 0, fci: 0 },
      { id: 3, name: 'Banco 3', saldoInicial: 0, fci: 0 },
      { id: 4, name: 'Banco 4', saldoInicial: 0, fci: 0 },
      { id: 5, name: 'Banco 5', saldoInicial: 0, fci: 0 },
      { id: 6, name: 'Banco 6', saldoInicial: 0, fci: 0 },
    ],
    movements: [] // { id, bankId, date(YYYY-MM-DD), ownIn, ownOut, in, out, desc }
  };
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState(); }
  catch { return defaultState(); }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = load();
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-based
let selectedBankId = 'all';
let editingId = null;
let chartInstances = {};

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function fmt(n) {
  if (!n && n !== 0) return '—';
  const v = parseFloat(n);
  if (v === 0) return '—';
  return '$' + v.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function bankColor(id) { return BANK_COLORS[(id-1) % BANK_COLORS.length]; }
function bankName(id) { return state.banks.find(b=>b.id===id)?.name || `Banco ${id}`; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function getMonthMovements() {
  const pad = n => String(n).padStart(2,'0');
  const prefix = `${currentYear}-${pad(currentMonth+1)}`;
  let mvs = state.movements.filter(m => m.date && m.date.startsWith(prefix));
  if (selectedBankId !== 'all') mvs = mvs.filter(m => m.bankId === selectedBankId);
  return mvs.sort((a,b) => a.date.localeCompare(b.date));
}

function calcTotals(mvs) {
  return mvs.reduce((acc, m) => {
    acc.ownIn += parseFloat(m.ownIn) || 0;
    acc.ownOut += parseFloat(m.ownOut) || 0;
    acc['in'] += parseFloat(m['in']) || 0;
    acc.out += parseFloat(m.out) || 0;
    return acc;
  }, { ownIn:0, ownOut:0, in:0, out:0 });
}

// ═══════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════
let currentView = 'movements';
function showView(v) {
  currentView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`view-${v}`).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(el => {
    if (el.textContent.toLowerCase().includes(v === 'movements' ? 'movim' : v === 'charts' ? 'gráf' : 'config'))
      el.classList.add('active');
  });
  render();
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function render() {
  updateMonthLabels();
  if (currentView === 'movements') {
    renderBankTabs();
    renderSummary();
    renderTable();
  } else if (currentView === 'charts') {
    renderCharts();
  } else if (currentView === 'settings') {
    renderSettings();
  }
}

function updateMonthLabels() {
  const html = `<span>${MONTHS[currentMonth]}</span>`;
  const el1 = document.getElementById('month-label');
  const el2 = document.getElementById('month-label-chart');
  const yr = document.getElementById('year-label');
  if (el1) el1.innerHTML = html;
  if (el2) el2.innerHTML = html;
  if (yr) yr.textContent = currentYear;
}

function renderBankTabs() {
  const cont = document.getElementById('bank-tabs');
  let html = `<button class="all-tab ${selectedBankId==='all'?'active':''}" onclick="selectBank('all')">Todos</button>`;
  state.banks.forEach(b => {
    const col = bankColor(b.id);
    html += `<button class="bank-tab ${selectedBankId===b.id?'active':''}" onclick="selectBank(${b.id})" style="${selectedBankId===b.id?`color:${col};border-color:${col};background:${col}18`:''}">`
      + `<span class="dot" style="background:${col}"></span>${b.name}</button>`;
  });
  cont.innerHTML = html;
}

function selectBank(id) {
  selectedBankId = id === 'all' ? 'all' : parseInt(id);
  render();
}

function renderSummary() {
  const mvs = getMonthMovements();
  const t = calcTotals(mvs);
  const net = (t.ownIn + t['in']) - (t.ownOut + t.out);
  const cont = document.getElementById('summary-cards');
  cont.innerHTML = `
    <div class="card"><div class="card-label">Own In</div><div class="card-value own-in">${fmt(t.ownIn)}</div></div>
    <div class="card"><div class="card-label">Own Out</div><div class="card-value own-out">${fmt(t.ownOut)}</div></div>
    <div class="card"><div class="card-label">Ingresos externos</div><div class="card-value in">${fmt(t['in'])}</div></div>
    <div class="card"><div class="card-label">Egresos externos</div><div class="card-value out">${fmt(t.out)}</div></div>
    <div class="card"><div class="card-label">Neto del mes</div><div class="card-value net ${net>=0?'pos':'neg'}">${fmt(net)}</div></div>
    <div class="card"><div class="card-label">Movimientos</div><div class="card-value" style="color:var(--muted2)">${mvs.length}</div></div>
  `;
  const bname = selectedBankId === 'all' ? 'Todos los bancos' : bankName(selectedBankId);
  document.getElementById('table-title').textContent = `${bname} — ${MONTHS[currentMonth]} ${currentYear}`;
}

function renderTable() {
  const mvs = getMonthMovements();
  const t = calcTotals(mvs);
  const cont = document.getElementById('table-container');
  if (mvs.length === 0) {
    cont.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><p>No hay movimientos este mes.<br>Hacé clic en "+ Agregar" para cargar uno.</p></div>`;
    return;
  }
  const showBankCol = selectedBankId === 'all';
  cont.innerHTML = `<table>
    <thead><tr>
      <th>Fecha</th>
      ${showBankCol ? '<th>Banco</th>' : ''}
      <th>Own In</th><th>Own Out</th><th>In</th><th>Out</th>
      <th>Descripción</th><th></th>
    </tr></thead>
    <tbody>
      ${mvs.map(m => `<tr>
        <td class="date-cell">${m.date}</td>
        ${showBankCol ? `<td class="bank-cell"><span style="color:${bankColor(m.bankId)}">${bankName(m.bankId)}</span></td>` : ''}
        <td class="own-in-cell">${fmt(m.ownIn)}</td>
        <td class="own-out-cell">${fmt(m.ownOut)}</td>
        <td class="in-cell">${fmt(m['in'])}</td>
        <td class="out-cell">${fmt(m.out)}</td>
        <td style="color:var(--muted2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.desc||''}</td>
        <td><div class="actions">
          <button class="icon-btn" onclick="openEdit('${m.id}')">✎</button>
          <button class="icon-btn del" onclick="deleteMovement('${m.id}')">✕</button>
        </div></td>
      </tr>`).join('')}
    </tbody>
    <tfoot><tr>
      <td class="lbl" ${showBankCol?'colspan="2"':''}>Totales</td>
      <td class="own-in-cell">${fmt(t.ownIn)}</td>
      <td class="own-out-cell">${fmt(t.ownOut)}</td>
      <td class="in-cell">${fmt(t['in'])}</td>
      <td class="out-cell">${fmt(t.out)}</td>
      <td colspan="2"></td>
    </tr></tfoot>
  </table>`;
}

// ═══════════════════════════════════════════════════════
//  CHARTS
// ═══════════════════════════════════════════════════════
function renderCharts() {
  const cont = document.getElementById('charts-container');
  // Destroy old instances
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  cont.innerHTML = `
    <div class="chart-card"><div class="chart-card-title">Totales por banco — ${MONTHS[currentMonth]}</div><canvas id="ch-banks"></canvas></div>
    <div class="chart-card"><div class="chart-card-title">Evolución mensual — año ${currentYear}</div><canvas id="ch-year"></canvas></div>
    <div class="chart-card"><div class="chart-card-title">Own In vs Own Out por banco</div><canvas id="ch-own"></canvas></div>
    <div class="chart-card"><div class="chart-card-title">In vs Out por banco</div><canvas id="ch-inout"></canvas></div>
  `;

  Chart.defaults.color = '#5a6070';
  Chart.defaults.borderColor = '#242830';

  // Chart 1: totals per bank this month
  const pad = n => String(n).padStart(2,'0');
  const prefix = `${currentYear}-${pad(currentMonth+1)}`;
  const bankLabels = state.banks.map(b=>b.name);
  const bankTotIn = state.banks.map(b => {
    const mvs = state.movements.filter(m=>m.bankId===b.id&&m.date&&m.date.startsWith(prefix));
    const t = calcTotals(mvs);
    return t.ownIn + t['in'];
  });
  const bankTotOut = state.banks.map(b => {
    const mvs = state.movements.filter(m=>m.bankId===b.id&&m.date&&m.date.startsWith(prefix));
    const t = calcTotals(mvs);
    return t.ownOut + t.out;
  });

  chartInstances['banks'] = new Chart(document.getElementById('ch-banks'), {
    type: 'bar',
    data: {
      labels: bankLabels,
      datasets: [
        { label: 'Total In', data: bankTotIn, backgroundColor: 'rgba(0,212,170,.7)', borderRadius: 5 },
        { label: 'Total Out', data: bankTotOut, backgroundColor: 'rgba(255,77,106,.7)', borderRadius: 5 }
      ]
    },
    options: { responsive: true, plugins: { legend: { labels: { color: '#8892a4', boxRadius: 3 } } }, scales: {
      x: { grid: { color: '#1a1f28' }, ticks: { color: '#5a6070' } },
      y: { grid: { color: '#1a1f28' }, ticks: { color: '#5a6070', callback: v => '$'+v.toLocaleString('es-AR') } }
    }}
  });

  // Chart 2: monthly evolution this year
  const monthlyNet = MONTHS.map((_, mi) => {
    const mpx = `${currentYear}-${pad(mi+1)}`;
    const mvs = state.movements.filter(m => m.date && m.date.startsWith(mpx));
    const t = calcTotals(mvs);
    return (t.ownIn + t['in']) - (t.ownOut + t.out);
  });
  chartInstances['year'] = new Chart(document.getElementById('ch-year'), {
    type: 'line',
    data: {
      labels: MONTHS.map(m=>m.slice(0,3)),
      datasets: [{
        label: 'Neto', data: monthlyNet,
        borderColor: '#0095ff', backgroundColor: 'rgba(0,149,255,.1)',
        tension: .4, fill: true, pointRadius: 4, pointBackgroundColor: '#0095ff'
      }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: {
      x: { grid: { color: '#1a1f28' }, ticks: { color: '#5a6070' } },
      y: { grid: { color: '#1a1f28' }, ticks: { color: '#5a6070', callback: v => '$'+v.toLocaleString('es-AR') } }
    }}
  });

  // Chart 3: Own In vs Own Out
  const ownInData = state.banks.map(b => {
    const mvs = state.movements.filter(m=>m.bankId===b.id&&m.date&&m.date.startsWith(prefix));
    return calcTotals(mvs).ownIn;
  });
  const ownOutData = state.banks.map(b => {
    const mvs = state.movements.filter(m=>m.bankId===b.id&&m.date&&m.date.startsWith(prefix));
    return calcTotals(mvs).ownOut;
  });
  chartInstances['own'] = new Chart(document.getElementById('ch-own'), {
    type: 'bar',
    data: {
      labels: bankLabels,
      datasets: [
        { label: 'Own In', data: ownInData, backgroundColor: 'rgba(0,149,255,.7)', borderRadius: 5 },
        { label: 'Own Out', data: ownOutData, backgroundColor: 'rgba(245,166,35,.7)', borderRadius: 5 }
      ]
    },
    options: { responsive: true, plugins: { legend: { labels: { color: '#8892a4', boxRadius: 3 } } }, scales: {
      x: { grid: { color: '#1a1f28' }, ticks: { color: '#5a6070' } },
      y: { grid: { color: '#1a1f28' }, ticks: { color: '#5a6070', callback: v => '$'+v.toLocaleString('es-AR') } }
    }}
  });

  // Chart 4: In vs Out
  const extInData = state.banks.map(b => {
    const mvs = state.movements.filter(m=>m.bankId===b.id&&m.date&&m.date.startsWith(prefix));
    return calcTotals(mvs)['in'];
  });
  const extOutData = state.banks.map(b => {
    const mvs = state.movements.filter(m=>m.bankId===b.id&&m.date&&m.date.startsWith(prefix));
    return calcTotals(mvs).out;
  });
  chartInstances['inout'] = new Chart(document.getElementById('ch-inout'), {
    type: 'bar',
    data: {
      labels: bankLabels,
      datasets: [
        { label: 'In externo', data: extInData, backgroundColor: 'rgba(0,212,170,.7)', borderRadius: 5 },
        { label: 'Out externo', data: extOutData, backgroundColor: 'rgba(255,77,106,.7)', borderRadius: 5 }
      ]
    },
    options: { responsive: true, plugins: { legend: { labels: { color: '#8892a4', boxRadius: 3 } } }, scales: {
      x: { grid: { color: '#1a1f28' }, ticks: { color: '#5a6070' } },
      y: { grid: { color: '#1a1f28' }, ticks: { color: '#5a6070', callback: v => '$'+v.toLocaleString('es-AR') } }
    }}
  });
}

// ═══════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════
function renderSettings() {
  const cont = document.getElementById('banks-grid');
  cont.innerHTML = state.banks.map(b => `
    <div class="bank-setting">
      <div class="bank-setting-header">
        <span class="bank-num">Banco ${b.id}</span>
        <div class="bank-color-dot" style="background:${bankColor(b.id)}"></div>
      </div>
      <input type="text" value="${b.name}" placeholder="Nombre del banco"
        onchange="updateBankName(${b.id}, this.value)"
        style="font-weight:600">
      <div class="saldo-row">
        <div class="form-group">
          <label>Saldo Inicial</label>
          <input type="number" value="${b.saldoInicial||0}" placeholder="0"
            onchange="updateBankField(${b.id}, 'saldoInicial', this.value)" step="0.01">
        </div>
        <div class="form-group">
          <label>FCI</label>
          <input type="number" value="${b.fci||0}" placeholder="0"
            onchange="updateBankField(${b.id}, 'fci', this.value)" step="0.01">
        </div>
      </div>
    </div>
  `).join('');
}

function updateBankName(id, val) {
  const b = state.banks.find(b=>b.id===id);
  if (b) { b.name = val.trim() || `Banco ${id}`; save(); }
}
function updateBankField(id, field, val) {
  const b = state.banks.find(b=>b.id===id);
  if (b) { b[field] = parseFloat(val)||0; save(); }
}

// ═══════════════════════════════════════════════════════
//  MODAL & CRUD
// ═══════════════════════════════════════════════════════
function openModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Agregar movimiento';
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('f-date').value = `${currentYear}-${pad(currentMonth+1)}-${pad(new Date().getDate())}`;
  document.getElementById('f-own-in').value = '';
  document.getElementById('f-own-out').value = '';
  document.getElementById('f-in').value = '';
  document.getElementById('f-out').value = '';
  document.getElementById('f-desc').value = '';
  populateBankSelect(selectedBankId !== 'all' ? selectedBankId : state.banks[0]?.id);
  document.getElementById('modal').classList.add('open');
}

function openEdit(id) {
  const m = state.movements.find(x=>x.id===id);
  if (!m) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Editar movimiento';
  document.getElementById('f-date').value = m.date;
  document.getElementById('f-own-in').value = m.ownIn || '';
  document.getElementById('f-own-out').value = m.ownOut || '';
  document.getElementById('f-in').value = m['in'] || '';
  document.getElementById('f-out').value = m.out || '';
  document.getElementById('f-desc').value = m.desc || '';
  populateBankSelect(m.bankId);
  document.getElementById('modal').classList.add('open');
}

function populateBankSelect(selectedId) {
  const sel = document.getElementById('f-bank');
  sel.innerHTML = state.banks.map(b =>
    `<option value="${b.id}" ${b.id===selectedId?'selected':''}>${b.name}</option>`
  ).join('');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function saveMovement() {
  const date = document.getElementById('f-date').value;
  if (!date) { alert('La fecha es obligatoria.'); return; }
  const bankId = parseInt(document.getElementById('f-bank').value);
  const ownIn = parseFloat(document.getElementById('f-own-in').value) || 0;
  const ownOut = parseFloat(document.getElementById('f-own-out').value) || 0;
  const inp = parseFloat(document.getElementById('f-in').value) || 0;
  const out = parseFloat(document.getElementById('f-out').value) || 0;
  const desc = document.getElementById('f-desc').value.trim();

  if (editingId) {
    const m = state.movements.find(x=>x.id===editingId);
    if (m) { Object.assign(m, { bankId, date, ownIn, ownOut, in: inp, out, desc }); }
  } else {
    state.movements.push({ id: uid(), bankId, date, ownIn, ownOut, in: inp, out, desc });
  }
  save();
  closeModal();
  // Set month/year to match saved date
  const parts = date.split('-');
  currentYear = parseInt(parts[0]);
  currentMonth = parseInt(parts[1]) - 1;
  render();
}

function deleteMovement(id) {
  if (!confirm('¿Eliminar este movimiento?')) return;
  state.movements = state.movements.filter(m=>m.id!==id);
  save(); render();
}

function clearAll() {
  if (!confirm('⚠️ Esto borrará TODOS los datos guardados. ¿Estás seguro?')) return;
  state = defaultState();
  save(); render();
}

// close modal on overlay click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
render();
</script>
</body>
</html>
